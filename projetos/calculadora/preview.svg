<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgCalc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#bgCalc)"/>

  <!-- Ícone de calculadora minimalista (Material Design style) -->
  <g transform="translate(140, 50)" filter="url(#iconShadow)">
    <!-- Quadrado arredondado com calculadora -->
    <rect x="0" y="0" width="120" height="140" rx="20" fill="#fff"/>

    <!-- Tela -->
    <rect x="15" y="15" width="90" height="30" rx="6" fill="#2d2d2d"/>
    <rect x="20" y="20" width="80" height="20" rx="3" fill="#1a1a1a"/>
    <text x="92" y="35" text-anchor="end" fill="#7CFFA0" font-family="'Courier New', monospace" font-size="14" font-weight="bold">42</text>

    <!-- Botões (grid 4x3) -->
    <g>
      <!-- Linha 1 -->
      <rect x="15" y="55" width="18" height="18" rx="3" fill="#f0f0f0"/>
      <rect x="38" y="55" width="18" height="18" rx="3" fill="#f0f0f0"/>
      <rect x="61" y="55" width="18" height="18" rx="3" fill="#f0f0f0"/>
      <rect x="84" y="55" width="21" height="18" rx="3" fill="#FF9500"/>

      <!-- Linha 2 -->
      <rect x="15" y="78" width="18" height="18" rx="3" fill="#fafafa"/>
      <rect x="38" y="78" width="18" height="18" rx="3" fill="#fafafa"/>
      <rect x="61" y="78" width="18" height="18" rx="3" fill="#fafafa"/>
      <rect x="84" y="78" width="21" height="18" rx="3" fill="#FF9500"/>

      <!-- Linha 3 -->
      <rect x="15" y="101" width="18" height="18" rx="3" fill="#fafafa"/>
      <rect x="38" y="101" width="18" height="18" rx="3" fill="#fafafa"/>
      <rect x="61" y="101" width="18" height="18" rx="3" fill="#fafafa"/>
      <rect x="84" y="101" width="21" height="18" rx="3" fill="#FF9500"/>

      <!-- Linha 4 (botão = maior) -->
      <rect x="15" y="124" width="64" height="14" rx="3" fill="#fafafa"/>
      <rect x="84" y="124" width="21" height="14" rx="3" fill="#FF9500"/>
    </g>
  </g>
</svg>
