<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgBoo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe4e4"/>
    </linearGradient>
    <radialGradient id="bCircle" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0d5d5"/>
    </radialGradient>
    <filter id="booShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b1538" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#bgBoo)"/>

  <!-- Pattern de patinhas no fundo (bem sutil) -->
  <g fill="#8b1538" opacity="0.05">
    <g transform="translate(40, 40)">
      <circle cx="0" cy="0" r="3"/>
      <circle cx="-5" cy="-5" r="1.5"/>
      <circle cx="5" cy="-5" r="1.5"/>
      <circle cx="0" cy="-7" r="1.5"/>
    </g>
    <g transform="translate(340, 60)">
      <circle cx="0" cy="0" r="3"/>
      <circle cx="-5" cy="-5" r="1.5"/>
      <circle cx="5" cy="-5" r="1.5"/>
      <circle cx="0" cy="-7" r="1.5"/>
    </g>
    <g transform="translate(60, 200)">
      <circle cx="0" cy="0" r="3"/>
      <circle cx="-5" cy="-5" r="1.5"/>
      <circle cx="5" cy="-5" r="1.5"/>
      <circle cx="0" cy="-7" r="1.5"/>
    </g>
    <g transform="translate(350, 190)">
      <circle cx="0" cy="0" r="3"/>
      <circle cx="-5" cy="-5" r="1.5"/>
      <circle cx="5" cy="-5" r="1.5"/>
      <circle cx="0" cy="-7" r="1.5"/>
    </g>
  </g>

  <!-- Logo Boo: B gigante estilizado -->
  <g transform="translate(200, 105)" filter="url(#booShadow)">
    <!-- Círculo de fundo (rosa claro) -->
    <circle cx="0" cy="0" r="75" fill="url(#bCircle)" stroke="#8b1538" stroke-width="4"/>

    <!-- Letra B estilizada em itálico -->
    <text x="0" y="28" text-anchor="middle" fill="#8b1538" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="bold" font-style="italic">B</text>

    <!-- Detalhe: patinha pequena sobre a letra -->
    <g transform="translate(35, -40)" fill="#8b1538">
      <ellipse cx="0" cy="0" rx="6" ry="7"/>
      <circle cx="-6" cy="-7" r="2.5"/>
      <circle cx="6" cy="-7" r="2.5"/>
      <circle cx="0" cy="-11" r="2.5"/>
    </g>
  </g>

  <!-- Texto embaixo: "Boo Pet Shop" -->
  <text x="200" y="210" text-anchor="middle" fill="#8b1538" font-family="Georgia, serif" font-size="18" font-weight="bold" font-style="italic" letter-spacing="1">Boo Pet Shop</text>
</svg>
