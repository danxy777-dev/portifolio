<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhes completos do Pokémon: estatísticas, evoluções, movimentos e muito mais.">
  <title>Pokémon — PokéDex</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23CC0000' stroke='%23111' stroke-width='4'/><rect x='2' y='46' width='96' height='8' fill='%23111'/><circle cx='50' cy='50' r='16' fill='white' stroke='%23111' stroke-width='4'/><circle cx='50' cy='50' r='7' fill='%23ddd' stroke='%23111' stroke-width='2'/></svg>">
  <style>
    /* Navegação entre Pokémon */
    .poke-nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: var(--nav-h); z-index: 9;
    }
    .poke-nav-btn {
      padding: 8px 16px; border-radius: 8px;
      background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); font-weight: 700; font-size: .88rem;
      cursor: pointer; transition: all .2s;
      display: flex; align-items: center; gap: 8px;
    }
    .poke-nav-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .poke-nav-btn img { width: 28px; height: 28px; image-rendering: pixelated; }
    .poke-nav-info { font-weight: 600; font-size: .9rem; color: var(--text2); }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="loader-pokeball"></div>
    <p>Carregando...</p>
  </div>
  <div id="toast" class="toast"></div>
  <button id="scroll-top" title="Topo">↑</button>

  <nav class="navbar">
    <a class="nav-logo" href="index.html">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" fill="white"/>
        <path d="M1 20 Q1 1 20 1 Q39 1 39 20" fill="#CC0000"/>
        <rect x="1" y="18" width="38" height="4" fill="#111"/>
        <circle cx="20" cy="20" r="7" fill="white" stroke="#111" stroke-width="2.5"/>
        <circle cx="20" cy="20" r="3" fill="#ddd"/>
      </svg>
      PokéDex
    </a>
    <div class="nav-links">
      <a href="index.html">Início</a>
      <a href="pokedex.html">Pokédex</a>
      <a href="tipos.html">Tipos</a>
      <a href="treinadores.html">Treinadores</a>
      <a href="batalhas.html">Batalhas</a>
    </div>
    <div class="nav-right">
      <button class="btn-dark-toggle" title="Tema">🌙</button>
      <button class="nav-hamburger" id="nav-hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>
  <div class="nav-mobile" id="nav-mobile">
    <a href="index.html">🏠 Início</a>
    <a href="pokedex.html">📖 Pokédex</a>
    <a href="tipos.html">🔥 Tipos</a>
    <a href="treinadores.html">🧢 Treinadores</a>
    <a href="batalhas.html">⚔️ Batalhas</a>
  </div>

  <!-- Navegação Anterior/Próximo -->
  <div class="poke-nav" id="poke-nav">
    <button class="poke-nav-btn" id="nav-prev" onclick="navigatePoke(-1)">← Anterior</button>
    <span class="poke-nav-info" id="poke-nav-label">Carregando...</span>
    <button class="poke-nav-btn" id="nav-next" onclick="navigatePoke(1)">Próximo →</button>
  </div>

  <!-- Conteúdo dinâmico -->
  <div id="detail-root" style="padding-top:0">
    <div style="padding-top:calc(var(--nav-h) + 60px)">
      <div class="spinner"></div>
    </div>
  </div>

  <footer class="footer" style="margin-top:40px">
    <div class="footer-logo">⚫ PokéDex</div>
    <div class="footer-links">
      <a href="pokedex.html">← Voltar à Pokédex</a>
      <a href="batalhas.html">⚔️ Batalhas</a>
    </div>
    <p class="footer-copy">Dados por <a href="https://pokeapi.co" target="_blank" style="color:rgba(255,255,255,.7)">PokéAPI</a></p>
  </footer>

  <script src="script.js"></script>
  <script>
    // Navegação entre Pokémon
    function getCurrentId() {
      return parseInt(new URLSearchParams(window.location.search).get('id') || 1);
    }

    function navigatePoke(dir) {
      const id = getCurrentId();
      const newId = Math.max(1, Math.min(1025, id + dir));
      if (newId !== id) window.location.href = `pokemon.html?id=${newId}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const id = getCurrentId();
      const label = document.getElementById('poke-nav-label');
      if (label) label.textContent = `Pokémon #${String(id).padStart(4,'0')}`;
      
      const prevBtn = document.getElementById('nav-prev');
      const nextBtn = document.getElementById('nav-next');
      if (prevBtn) {
        if (id <= 1) prevBtn.disabled = true;
        else {
          prevBtn.innerHTML = `← #${String(id-1).padStart(3,'0')}`;
          const prevImg = document.createElement('img');
          prevImg.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id-1}.png`;
          prevBtn.prepend(prevImg);
        }
      }
      if (nextBtn) {
        if (id >= 1025) nextBtn.disabled = true;
        else {
          nextBtn.innerHTML = `#${String(id+1).padStart(3,'0')} →`;
          const nextImg = document.createElement('img');
          nextImg.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id+1}.png`;
          nextBtn.prepend(nextImg);
        }
      }
    });

    // Atalhos de teclado
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') navigatePoke(-1);
      if (e.key === 'ArrowRight') navigatePoke(1);
    });
  </script>
</body>
</html>
