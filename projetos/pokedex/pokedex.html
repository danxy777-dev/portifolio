<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lista completa com todos os 1025 Pokémon. Filtre por tipo, geração, lendário e muito mais.">
  <title>Pokédex — Lista de Pokémon</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23CC0000' stroke='%23111' stroke-width='4'/><rect x='2' y='46' width='96' height='8' fill='%23111'/><circle cx='50' cy='50' r='16' fill='white' stroke='%23111' stroke-width='4'/><circle cx='50' cy='50' r='7' fill='%23ddd' stroke='%23111' stroke-width='2'/></svg>">
</head>
<body>

  <div id="loading-screen">
    <div class="loader-pokeball"></div>
    <p>Carregando Pokédex...</p>
  </div>
  <div id="toast" class="toast"></div>
  <button id="scroll-top" title="Topo">↑</button>

  <nav class="navbar">
    <a class="nav-logo" href="index.html">
      <svg viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" fill="white"/>
        <path d="M1 20 Q1 1 20 1 Q39 1 39 20" fill="#CC0000"/>
        <rect x="1" y="18" width="38" height="4" fill="#111"/>
        <circle cx="20" cy="20" r="7" fill="white" stroke="#111" stroke-width="2.5"/>
        <circle cx="20" cy="20" r="3" fill="#ddd"/>
      </svg>
      PokéDex
    </a>
    <div class="nav-links">
      <a href="index.html">Início</a>
      <a href="pokedex.html" class="active">Pokédex</a>
      <a href="tipos.html">Tipos</a>
      <a href="treinadores.html">Treinadores</a>
      <a href="batalhas.html">Batalhas</a>
    </div>
    <div class="nav-right">
      <button class="btn-dark-toggle" title="Tema">🌙</button>
      <button class="nav-hamburger" id="nav-hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>
  <div class="nav-mobile" id="nav-mobile">
    <a href="index.html">🏠 Início</a>
    <a href="pokedex.html" class="active">📖 Pokédex</a>
    <a href="tipos.html">🔥 Tipos</a>
    <a href="treinadores.html">🧢 Treinadores</a>
    <a href="batalhas.html">⚔️ Batalhas</a>
  </div>

  <div class="page">
    <div class="container">

      <!-- Header -->
      <div style="margin-bottom:24px">
        <div class="breadcrumb">
          <a href="index.html">Início</a>
          <span class="breadcrumb-sep">/</span>
          <span>Pokédex</span>
        </div>
        <h1 style="font-size:2rem;font-weight:900;margin-bottom:4px">📖 Pokédex Nacional</h1>
        <p style="color:var(--text2)">Explore todos os 1025 Pokémon de todas as gerações</p>
      </div>

      <!-- Barra de busca e filtros -->
      <div class="search-bar">
        <div class="search-row">
          <div class="search-input-wrap">
            <span class="icon">🔍</span>
            <input type="text" id="search-input" class="search-input" 
                   placeholder="Buscar por nome ou número (#25)..." 
                   autocomplete="off">
          </div>
          <select id="type-filter" class="filter-select">
            <option value="">Todos os tipos</option>
            <option value="normal">Normal</option>
            <option value="fire">Fogo</option>
            <option value="water">Água</option>
            <option value="electric">Elétrico</option>
            <option value="grass">Grama</option>
            <option value="ice">Gelo</option>
            <option value="fighting">Lutador</option>
            <option value="poison">Veneno</option>
            <option value="ground">Terra</option>
            <option value="flying">Voador</option>
            <option value="psychic">Psíquico</option>
            <option value="bug">Inseto</option>
            <option value="rock">Pedra</option>
            <option value="ghost">Fantasma</option>
            <option value="dragon">Dragão</option>
            <option value="dark">Sombrio</option>
            <option value="steel">Aço</option>
            <option value="fairy">Fada</option>
          </select>
          <select id="gen-filter" class="filter-select">
            <option value="">Todas as gerações</option>
            <option value="1">Geração 1 — Kanto</option>
            <option value="2">Geração 2 — Johto</option>
            <option value="3">Geração 3 — Hoenn</option>
            <option value="4">Geração 4 — Sinnoh</option>
            <option value="5">Geração 5 — Unova</option>
            <option value="6">Geração 6 — Kalos</option>
            <option value="7">Geração 7 — Alola</option>
            <option value="8">Geração 8 — Galar</option>
            <option value="9">Geração 9 — Paldea</option>
          </select>
          <select id="sort-filter" class="filter-select">
            <option value="number">Ordenar: Número</option>
            <option value="name">Ordenar: Nome (A-Z)</option>
          </select>
        </div>
        <div class="filters-row">
          <span style="font-size:.85rem;color:var(--text2);font-weight:600">Filtros:</span>
          <button class="filter-tag" id="filter-legendary">⭐ Lendários</button>
          <button class="filter-tag" id="filter-mythic">✨ Míticos</button>
          <button class="filter-tag" id="filter-favs">❤️ Favoritos</button>
          <span class="results-info" id="results-count" style="margin-left:auto"></span>
        </div>
      </div>

      <!-- Grade de Pokémon -->
      <div class="pokemon-grid" id="pokemon-grid">
        <div class="spinner"></div>
      </div>

      <!-- Load More -->
      <div class="load-more-wrap">
        <button class="btn-load-more" id="load-more-btn" style="display:none">
          Carregar mais Pokémon ↓
        </button>
      </div>

    </div>
  </div>

  <footer class="footer">
    <div class="footer-logo">⚫ PokéDex</div>
    <p class="footer-copy">Dados por <a href="https://pokeapi.co" target="_blank" style="color:rgba(255,255,255,.7)">PokéAPI</a> · Pokémon © Nintendo/Game Freak</p>
  </footer>

  <script src="script.js"></script>
  <script>
    // Aplica filtro de geração via URL
    const urlParams = new URLSearchParams(window.location.search);
    const genParam = urlParams.get('gen');
    if (genParam) {
      document.addEventListener('DOMContentLoaded', () => {
        const sel = document.getElementById('gen-filter');
        if (sel) { sel.value = genParam; sel.dispatchEvent(new Event('change')); }
      });
    }
  </script>
</body>
</html>
