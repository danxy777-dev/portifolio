<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="pokeballBig" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ff6060"/>
      <stop offset="100%" stop-color="#a00"/>
    </radialGradient>
    <radialGradient id="pokeballBottom" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </radialGradient>
    <linearGradient id="bgPoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <filter id="bigShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#bgPoke)"/>

  <!-- Estrelinhas -->
  <g fill="#fff">
    <circle cx="40" cy="35" r="0.7" opacity="0.5"/>
    <circle cx="360" cy="50" r="1" opacity="0.7"/>
    <circle cx="60" cy="180" r="0.6" opacity="0.4"/>
    <circle cx="340" cy="200" r="0.8" opacity="0.6"/>
    <circle cx="200" cy="20" r="0.5" opacity="0.4"/>
    <circle cx="100" cy="60" r="0.5" opacity="0.5"/>
    <circle cx="300" cy="100" r="0.6" opacity="0.5"/>
  </g>

  <!-- Pokébola GIGANTE centralizada -->
  <g transform="translate(200, 120)" filter="url(#bigShadow)">
    <circle cx="0" cy="0" r="90" fill="url(#pokeballBig)" stroke="#111" stroke-width="6"/>
    <path d="M -90 0 A 90 90 0 0 0 90 0 Z" fill="url(#pokeballBottom)" stroke="none"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#111" stroke-width="6"/>
    <circle cx="0" cy="0" r="28" fill="#fff" stroke="#111" stroke-width="6"/>
    <circle cx="0" cy="0" r="12" fill="#ddd" stroke="#111" stroke-width="3"/>
    <!-- Brilho -->
    <ellipse cx="-30" cy="-25" rx="18" ry="12" fill="#fff" opacity="0.4"/>
    <ellipse cx="-30" cy="-25" rx="8" ry="5" fill="#fff" opacity="0.7"/>
  </g>

  <!-- Logo Pokémon Company embaixo (texto oficial) -->
  <g transform="translate(200, 220)">
    <text x="0" y="0" text-anchor="middle" fill="#FFD700" font-family="Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="2">POKÉMON</text>
  </g>
</svg>
