<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgAcademia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#DA291C"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <filter id="iconShadowAcad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#bgAcademia)"/>

  <!-- Detalhes diagonais sutis (textura) -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
  </g>

  <!-- Halter centralizado -->
  <g transform="translate(100, 90)" filter="url(#iconShadowAcad)">
    <!-- Barra central -->
    <rect x="60" y="22" width="80" height="8" rx="2" fill="#fff"/>

    <!-- Peso esquerdo (externo) -->
    <rect x="20" y="6" width="18" height="40" rx="3" fill="#fff"/>
    <!-- Peso esquerdo (interno) -->
    <rect x="40" y="14" width="14" height="24" rx="2" fill="#f0f0f0"/>

    <!-- Peso direito (interno) -->
    <rect x="146" y="14" width="14" height="24" rx="2" fill="#f0f0f0"/>
    <!-- Peso direito (externo) -->
    <rect x="162" y="6" width="18" height="40" rx="3" fill="#fff"/>
  </g>

  <!-- Texto "FORÇA" embaixo -->
  <g transform="translate(200, 200)">
    <text x="0" y="0" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold" letter-spacing="3" opacity="0.9">FORÇA</text>
  </g>
</svg>
