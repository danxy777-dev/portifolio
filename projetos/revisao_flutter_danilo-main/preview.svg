<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgFlutter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="50%" stop-color="#0E5499"/>
      <stop offset="100%" stop-color="#13B9FD"/>
    </linearGradient>
    <linearGradient id="flutterTri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#54C5F8"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>
    <filter id="iconShadowFlutter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#bgFlutter)"/>

  <!-- Linhas diagonais sutis (hot reload vibe) -->
  <g opacity="0.05" stroke="#13B9FD" stroke-width="1">
    <line x1="0" y1="40" x2="400" y2="120"/>
    <line x1="0" y1="80" x2="400" y2="160"/>
    <line x1="0" y1="120" x2="400" y2="200"/>
  </g>

  <!-- Logo Flutter estilizada (triângulo com F cortado) -->
  <g transform="translate(160, 60)" filter="url(#iconShadowFlutter)">
    <!-- Triângulo principal do Flutter -->
    <path d="M 40 0 L 80 50 L 40 100 L 0 50 Z" fill="url(#flutterTri)"/>
    <!-- "F" cortado no centro (forma negativa) -->
    <path d="M 32 30 L 56 30 L 50 38 L 38 38 L 38 50 L 50 50 L 44 58 L 38 58 L 38 78 L 30 70 Z" fill="#fff"/>
  </g>

  <!-- Texto "FLUTTER" embaixo -->
  <g transform="translate(200, 200)">
    <text x="0" y="0" text-anchor="middle" fill="#fff" font-family="'Courier New', monospace" font-size="13" font-weight="bold" letter-spacing="3" opacity="0.85">Dart • Mobile</text>
  </g>
</svg>
